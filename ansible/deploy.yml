---
# Nasadí statický web na s1.varhoo.cz a zapne Apache 2 vhost.
# Inventář ansible/hosts není v gitu: cp ansible/hosts.example ansible/hosts
#
#   ansible-playbook -i ansible/hosts ansible/deploy.yml
#   make deploy
#
# HTTPS se doplní, jakmile DNS jméno server_name ukazuje na server
# (CNAME na s1.varhoo.cz). Bez DNS playbook web nasadí po HTTP.
# Certbot lze vynechat: -e request_certificate=false

- name: Nasadit Parkování v Brně
  hosts: all
  vars:
    server_name: parkovanivbrne.varhoo.cz
    web_root: /var/www/parkovani-brno
    site_name: parkovani-brno
    request_certificate: true

  tasks:
    - name: Moduly Apache
      ansible.builtin.command: a2enmod rewrite ssl deflate expires
      register: a2enmod
      changed_when: a2enmod.stdout is search('Enabling module')

    - name: Adresář webu
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: HTML stránky
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ web_root }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - index.html
        - pravidla.html
        - README.md
        - robots.txt
        - sitemap.xml

    - name: Adresáře css, js a img
      ansible.builtin.file:
        path: "{{ web_root }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - css
        - js
        - img

    - name: css, js a img
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}/"
        dest: "{{ web_root }}/{{ item }}/"
        owner: root
        group: root
        mode: "0644"
      loop:
        - css
        - js
        - img

    - name: Je na disku certifikát?
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ server_name }}/fullchain.pem"
      register: cert_stat

    - name: Apache vhost
      ansible.builtin.import_tasks: vhost.yml

    - name: Zapnout vhost
      ansible.builtin.command: "a2ensite {{ site_name }}"
      args:
        creates: "/etc/apache2/sites-enabled/{{ site_name }}.conf"
      register: ensite

    - name: Kontrola konfigurace Apache
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    - name: Načíst Apache
      ansible.builtin.service:
        name: apache2
        state: reloaded
      when: a2enmod.changed or vhost is changed or ensite is changed

    - name: Požádat certbot o certifikát
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - -w
          - "{{ web_root }}"
          - -d
          - "{{ server_name }}"
          - --non-interactive
          - --agree-tos
          - --register-unsafely-without-email
          - --keep-until-expiring
      register: certbot
      changed_when: >-
        certbot.rc == 0 and 'not yet due for renewal' not in (certbot.stdout | lower)
      failed_when: false
      when: request_certificate | bool

    - name: Certbot se nepovedl, web zůstává na HTTP
      ansible.builtin.debug:
        msg: >-
          Certifikát pro {{ server_name }} se nevystavil
          (DNS zatím na tento server neukazuje).
          Web běží na HTTP. Až bude CNAME na s1.varhoo.cz, spusťte playbook znovu.
      when: request_certificate | bool and certbot.rc != 0

    - name: Certifikát po certbotu
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ server_name }}/fullchain.pem"
      register: cert_stat

    - name: Apache vhost s HTTPS, pokud certifikát existuje
      ansible.builtin.import_tasks: vhost.yml

    - name: Kontrola konfigurace Apache po HTTPS
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    - name: Načíst Apache po HTTPS
      ansible.builtin.service:
        name: apache2
        state: reloaded
      when: vhost is changed
